# dsp-orchestration-pipeline.yml
# Orchestrates the Architect, CodeGen, and Test agents.

stages:
  - architecture_design
  - core_generation
  - dual_mode_validation
  - friction_resolution
  - graph_export

jobs:
  architect_spawn:
    stage: architecture_design
    script:
      - echo "Spawning Architect Agent..."
      # - spawn_agent --role="Architect" --intent="Analog warmth at edge scale"
    artifacts:
      paths: [ ".output/design.json" ]

  codegen_spawn:
    stage: core_generation
    needs: [ architect_spawn ]
    script:
      - echo "Spawning CodeGen Agent..."
      # - spawn_agent --role="CodeGen" --input=".output/design.json"

  test_spawn:
    stage: dual_mode_validation
    needs: [ codegen_spawn ]
    script:
      - echo "Spawning Tester Agent..."
      # - spawn_agent --role="Tester" --mode="technical_and_emotional"

  mediator_hook:
    stage: friction_resolution
    rules:
      - if: '$DUALITY_FRICTION_SCORE > 0.6'
    script:
      - echo "Friction detected. Spawning Mediator..."
      # - spawn_agent --role="Mediator" --context="LangSmith_Traces"

  neo4j_sync:
    stage: graph_export
    script:
      - echo "Exporting orchestration graph to Neo4j..."
      # - cypher-shell -f dsp_system/neo4j_import.cypher
