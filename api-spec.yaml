openapi: 3.0.3
info:
  title: AI-Powered Audio Mastering Service API
  description: RESTful API for AI-powered audio mastering service using Mamba-based models
  version: 1.0.0
  contact:
    name: API Support
    email: api@audio-mastering.example.com
servers:
  - url: https://api.audio-mastering.example.com/v1
    description: Production server
  - url: https://staging-api.audio-mastering.example.com/v1
    description: Staging server
  - url: http://localhost:8000/v1
    description: Development server
tags:
  - name: authentication
    description: User authentication and authorization
  - name: jobs
    description: Mastering job management
  - name: files
    description: File upload and download operations
  - name: presets
    description: Mastering presets and parameters
  - name: health
    description: Service health checks
paths:
  /auth/register:
    post:
      tags: [authentication]
      summary: Register a new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      tags: [authentication]
      summary: Log in user
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      tags: [authentication]
      summary: Log out user
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /jobs:
    get:
      tags: [jobs]
      summary: List user's mastering jobs
      operationId: listJobs
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of jobs to return
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of jobs to skip
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, processing, completed, failed, cancelled]
          description: Filter by job status
      responses:
        '200':
          description: List of jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [jobs]
      summary: Create a new mastering job
      operationId: createJob
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
      responses:
        '202':
          description: Job accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Payment required / insufficient credits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /jobs/{jobId}:
    get:
      tags: [jobs]
      summary: Get job status and details
      operationId: getJob
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [jobs]
      summary: Cancel a job
      operationId: cancelJob
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Job cannot be cancelled (already completed/failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /jobs/{jobId}/result:
    get:
      tags: [jobs]
      summary: Get mastered audio file download URL
      operationId: getJobResult
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Download URL for mastered file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResultResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found or not completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Result expired (file deleted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /files/upload-url:
    post:
      tags: [files]
      summary: Get presigned URL for file upload
      operationId: getUploadUrl
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /presets:
    get:
      tags: [presets]
      summary: List available mastering presets
      operationId: listPresets
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of presets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      tags: [health]
      summary: Health check endpoint
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    UserRegisterRequest:
      type: object
      required:
        - email
        - password
        - fullName
      properties:
        email:
          type: string
          format: email
          description: User's email address
        password:
          type: string
          format: password
          minLength: 8
          description: User's password
        fullName:
          type: string
          minLength: 2
          maxLength: 100
          description: User's full name
    UserLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User's email address
        password:
          type: string
          format: password
          description: User's password
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT token for authentication
        tokenType:
          type: string
          default: Bearer
          description: Token type
        expiresIn:
          type: integer
          description: Expiration time in seconds
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: User ID
        email:
          type: string
          format: email
          description: User's email
        fullName:
          type: string
          description: User's full name
        createdAt:
          type: string
          format: date-time
          description: Account creation timestamp
        credits:
          type: integer
          description: Available processing credits
        subscriptionTier:
          type: string
          enum: [free, pro, enterprise]
          description: Subscription level
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          additionalProperties: true
          description: Additional error details (optional)
        timestamp:
          type: string
          format: date-time
          description: Error timestamp
        path:
          type: string
          description: Request path that caused the error
    JobCreateRequest:
      type: object
      required:
        - fileName
        - fileSize
        - presetId
        - contentType
      properties:
        fileName:
          type: string
          maxLength: 255
          description: Original filename
        fileSize:
          type: integer
          minimum: 1
          maximum: 2147483648
          description: File size in bytes
        presetId:
          type: string
          enum: [transparent, warm, loud]
          description: Mastering preset to use
        contentType:
          type: string
          enum: [audio/wav, audio/aiff, audio/flac]
          description: MIME type of audio file
        intensity:
          type: number
          minimum: 0
          maximum: 100
          default: 50
          description: Preset intensity percentage
        loudnessTarget:
          type: number
          minimum: -24
          maximum: -6
          default: -14
          description: Target loudness in LUFS (optional)
        stereoWidth:
          type: number
          minimum: 0
          maximum: 200
          default: 100
          description: Stereo width percentage (optional)
        enableTruePeakLimiting:
          type: boolean
          default: true
          description: Enable true peak limiting
    JobResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Job ID
        status:
          type: string
          enum: [pending, processing, completed, failed, cancelled]
          description: Current job status
        presetId:
          type: string
          description: Used mastering preset
        intensity:
          type: number
          description: Used intensity percentage
        createdAt:
          type: string
          format: date-time
          description: Job creation timestamp
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: Job start timestamp
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Job completion timestamp
        fileName:
          type: string
          description: Original filename
        fileSize:
          type: integer
          description: File size in bytes
        resultUrl:
          type: string
          format: uri
          nullable: true
          description: Download URL for mastered result (when completed)
        errorMessage:
          type: string
          nullable: true
          description: Error message if job failed
        creditsUsed:
          type: integer
          nullable: true
          description: Number of credits consumed
    JobListResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/JobResponse'
        total:
          type: integer
          description: Total number of jobs
        limit:
          type: integer
          description: Limit used for this query
        offset:
          type: integer
          description: Offset used for this query
    JobResultResponse:
      type: object
      properties:
        downloadUrl:
          type: string
          format: uri
          description: Presigned URL for downloading mastered file
        expiresIn:
          type: integer
          description: URL expiration time in seconds
        fileName:
          type: string
          description: Mastered filename
        fileSize:
          type: integer
          description: Mastered file size in bytes
        format:
          type: string
          description: Audio format (wav, aiff, flac)
        sampleRate:
          type: integer
          description: Sample rate in Hz
        bitDepth:
          type: integer
          description: Bit depth
        loudnessMetrics:
          $ref: '#/components/schemas/LoudnessMetrics'
    LoudnessMetrics:
      type: object
      properties:
        integratedLUFS:
          type: number
          description: Integrated loudness in LUFS
        truePeak:
          type: number
          description: True peak in dBTP
        lra:
          type: number
          description: Loudness range in LU
        peak:
          type: number
          description: Peak amplitude in dBFS
    UploadUrlRequest:
      type: object
      required:
        - fileName
        - fileSize
        - contentType
        - jobId
      properties:
        fileName:
          type: string
          maxLength: 255
          description: Original filename
        fileSize:
          type: integer
          minimum: 1
          maximum: 2147483648
          description: File size in bytes
        contentType:
          type: string
          enum: [audio/wav, audio/aiff, audio/flac]
          description: MIME type of audio file
        jobId:
          type: string
          format: uuid
          description: ID of the job to associate the upload with
    UploadUrlResponse:
      type: object
      properties:
        uploadUrl:
          type: string
          format: uri
          description: Presigned PUT URL for uploading file
        fields:
          type: object
          additionalProperties: true
          description: Form fields for POST upload (if applicable)
        method:
          type: string
          enum: [PUT, POST]
          description: HTTP method to use with uploadUrl
        expiresIn:
          type: integer
          description: URL expiration time in seconds
    PresetListResponse:
      type: object
      properties:
        presets:
          type: array
          items:
            $ref: '#/components/schemas/Preset'
        total:
          type: integer
          description: Total number of presets
    Preset:
      type: object
      properties:
        id:
          type: string
          enum: [transparent, warm, loud]
          description: Preset identifier
        name:
          type: string
          description: Human-readable preset name
        description:
          type: string
          description: Detailed preset description
        defaultIntensity:
          type: integer
          minimum: 0
          maximum: 100
          default: 50
          description: Recommended default intensity
        parameters:
          type: object
          properties:
            loudnessTarget:
              type: number
              minimum: -24
              maximum: -6
              description: Target loudness in LUFS
            stereoWidth:
              type: number
              minimum: 0
              maximum: 200
              description: Stereo width percentage
            saturation:
              type: number
              minimum: 0
              maximum: 100
              description: Saturation amount
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
          description: Overall service status
        timestamp:
          type: string
          format: date-time
          description: Check timestamp
        version:
          type: string
          description: API version
        uptimeSeconds:
          type: integer
          description: Service uptime in seconds
        components:
          type: object
          additionalProperties:
            type: string
            enum: [healthy, degraded, unhealthy]
          description: Status of individual components
securitySchemes:
  bearerAuth:
    type: http
    scheme: bearer
    bearerFormat: JWT